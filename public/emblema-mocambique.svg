<?xml version="1.0" encoding="UTF-8"?>
<!--
  Representação esquemática do Emblema da República de Moçambique
  para uso digital de referência. Para arte oficial completa ver:
  Wikimedia Commons — Emblem of Mozambique.svg
  https://commons.wikimedia.org/wiki/File:Emblem_of_Mozambique.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Emblema da República de Moçambique">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba3d9"/>
      <stop offset="100%" stop-color="#1e5a8a"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#d4c4a8"/>
    </linearGradient>
  </defs>
  <!-- engrenagem exterior -->
  <circle cx="100" cy="95" r="78" fill="none" stroke="#c4a35a" stroke-width="10"/>
  <circle cx="100" cy="95" r="78" fill="none" stroke="#8b6914" stroke-width="2" stroke-dasharray="6 10" stroke-linecap="square"/>
  <!-- disco central -->
  <circle cx="100" cy="95" r="68" fill="url(#sky)"/>
  <circle cx="100" cy="95" r="68" fill="none" stroke="#c4a35a" stroke-width="2"/>
  <!-- sol -->
  <circle cx="100" cy="58" r="14" fill="#f0c14a"/>
  <g stroke="#f0c14a" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="36" x2="100" y2="30"/>
    <line x1="100" y1="86" x2="100" y2="80"/>
    <line x1="78" y1="58" x2="72" y2="58"/>
    <line x1="128" y1="58" x2="122" y2="58"/>
    <line x1="84" y1="42" x2="80" y2="38"/>
    <line x1="116" y1="42" x2="120" y2="38"/>
    <line x1="84" y1="74" x2="80" y2="78"/>
    <line x1="116" y1="74" x2="120" y2="78"/>
  </g>
  <!-- livro -->
  <path d="M70 78 L100 88 L130 78 L130 118 L100 128 L70 118 Z" fill="url(#book)" stroke="#5c4a32" stroke-width="1.5"/>
  <path d="M100 88 L100 128" stroke="#5c4a32" stroke-width="1.2"/>
  <!-- engrenagem pequena / indústria -->
  <circle cx="78" cy="105" r="11" fill="none" stroke="#2d2d2d" stroke-width="3"/>
  <circle cx="78" cy="105" r="4" fill="#2d2d2d"/>
  <!-- foice estilizada -->
  <path d="M118 100 Q140 95 138 120" fill="none" stroke="#2d2d2d" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="118" y1="100" x2="112" y2="130" stroke="#8b4513" stroke-width="3" stroke-linecap="round"/>
  <!-- AK estilizado (linha) -->
  <path d="M55 125 L95 112 L145 108" fill="none" stroke="#2d2d2d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M95 112 L98 122" stroke="#2d2d2d" stroke-width="2"/>
  <!-- estrela vermelha -->
  <polygon points="100,148 103,157 112,157 105,163 108,172 100,166 92,172 95,163 88,157 97,157" fill="#c8102e"/>
  <!-- fita / base -->
  <path d="M40 175 Q100 165 160 175 L155 195 Q100 185 45 195 Z" fill="#c8102e"/>
  <path d="M45 178 Q100 170 155 178" fill="none" stroke="#f0c14a" stroke-width="1.5"/>
  <text x="100" y="190" text-anchor="middle" fill="#f5f5f5" font-family="Georgia, serif" font-size="9" font-weight="700">REPÚBLICA DE MOÇAMBIQUE</text>
</svg>
